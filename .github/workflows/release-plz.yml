name: Release-plz

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия частичного выпуска для продолжения (например, 0.15.0)'
        required: true
        type: string

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    name: Publish crate
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'odineska' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: release-plz-publish
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - &install-rust
        name: Установка Rust из rust-toolchain.toml
        run: rustup show
      - name: Подготовка повторной публикации
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          python3 -B tools/release_bundle.py resume-config
          --version "$RELEASE_VERSION"
          --output "$RUNNER_TEMP/release-plz-resume.toml"
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          version: 0.3.174
          config: ${{ github.event_name == 'workflow_dispatch' && format('{0}/release-plz-resume.toml', runner.temp) || 'release-plz.toml' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # A retry may publish only remaining dependencies, omitting eska from action outputs.
      - name: Start binary distribution
        if: steps.release-plz.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(python3 -B tools/release_bundle.py version)"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent
          gh workflow run release.yml --ref "$tag" -f tag="$tag"

  release-pr:
    needs: check
    name: Release PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'odineska' && github.event_name == 'push' }}
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
      contents: write
      actions: write
    steps:
      - *checkout
      - *install-rust
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          version: 0.3.174
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # PR events created by GITHUB_TOKEN do not trigger another workflow.
      - name: Проверка подготовленного релизного PR
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          branch="$(jq -er '.head_branch' <<< "$RELEASE_PR")"
          gh workflow run ci.yml --ref "$branch"

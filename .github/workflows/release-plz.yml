name: Release-plz

on:
  push:
    branches:
      - main

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    name: Publish crate
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == '1c-tooling' }}
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - &install-rust
        name: Установка Rust из rust-toolchain.toml
        run: rustup show
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          version: 0.3.174
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Start binary distribution
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail

          mapfile -t tags < <(jq -r '.[] | select(.package_name == "eska") | .tag' <<< "$RELEASES")
          if (( ${#tags[@]} == 0 )); then
            echo "::error ::release-plz reported a release without a tag"
            exit 1
          fi

          for tag in "${tags[@]}"; do
            gh workflow run release.yml --ref "$tag" -f tag="$tag"
          done

  release-pr:
    needs: check
    name: Release PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == '1c-tooling' }}
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
      contents: write
      actions: write
    steps:
      - *checkout
      - *install-rust
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          version: 0.3.174
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # PR events created by GITHUB_TOKEN do not trigger another workflow.
      - name: Проверка подготовленного релизного PR
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          branch="$(jq -er '.head_branch' <<< "$RELEASE_PR")"
          gh workflow run ci.yml --ref "$branch"

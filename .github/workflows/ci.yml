name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Установка Rust из rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Форматирование, сборка и статические проверки
        run: |
          cargo fmt --check
          cargo check --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Тесты и упаковка Cargo workspace
        run: |
          mkdir -p ../eska-playground
          export ESKA_TEST_ROOT="$(realpath ../eska-playground)"
          cargo test --locked
          python3 -B -m unittest discover -s tests/components -p 'test_*.py'
          cargo package --workspace --locked
          python3 -B tools/release_bundle.py verify-crates

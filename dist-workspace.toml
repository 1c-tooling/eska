[workspace]
members = ["dist:target/release-bundle"]

# tools/release_bundle.py derives this bundle from the Cargo workspace version.
# The full installer includes all six binaries; selective ZIPs remain independent.
[dist]
cargo-dist-version = "0.32.0"
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
install-path = "~/.eska/bin"
hosting = "github"
install-updater = false
dispatch-releases = true
source-tarball = false

[dist.min-glibc-version]
x86_64-unknown-linux-gnu = "2.35"
aarch64-unknown-linux-gnu = "2.35"

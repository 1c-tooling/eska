[package]
name = "eska"
version = "0.2.0"
edition = "2024"
publish = true
description = "Утилита для разработчиков 1С Enterprise"
license = "Apache-2.0"
repository = "https://github.com/1c-tooling/eska"
readme = "README.md"
keywords = ["1c-enterpirse", "cli"]
categories = ["command-line-utilities", "filesystem"]
authors = ["Aleksey Kalsin <aleksey@kalsin.pro>"]

[profile.dev]
opt-level = 0 # No optimization for fast compile times
debug = true  # Include debug symbols

[profile.release]
opt-level = 3 # Maximum optimization for performance
debug = false # Exclude debug symbols for smaller binary size
lto = true    # Link-Time Optimization for further size reduction

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[dependencies]
clap = { version = "4.5.57", features = ["derive", "string"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows", "bracketed-paste"] }
fluent = "0.17.0"
gix = { version = "0.80.0", default-features = false, features = ["revision", "status", "zlib-rs"] }
roxmltree = { version = "0.21.1", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
toml = { version = "1.1.4", default-features = false, features = ["display", "parse", "serde"] }

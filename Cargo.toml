[package]
name = "eska"
version = "0.14.2"
edition = "2024"
publish = true
description = "Утилита для разработчиков 1С Enterprise"
license = "Apache-2.0"
repository = "https://github.com/1c-tooling/eska"
readme = "README.md"
keywords = ["1c-enterpirse", "cli"]
categories = ["command-line-utilities", "filesystem"]
authors = ["Aleksey Kalsin <aleksey@kalsin.pro>"]

[[bin]]
name = "eska"
path = "src/main.rs"
required-features = ["legacy"]

[[bin]]
name = "eska-project"
path = "src/bin/eska-project.rs"
required-features = ["project-cli"]

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["legacy"]

[[test]]
name = "project_tool"
path = "tests/project_tool.rs"
required-features = ["project-cli"]

[features]
default = ["legacy"]
# Native platform infrastructure is optional for source-only consumers.
build = ["dep:ctrlc"]
# Human/JSON presentation is shared by tools, independent of the installed application.
tool-cli = ["dep:clap", "dep:fluent", "dep:sys-locale"]
project-cli = ["tool-cli"]
# Preserve the existing installed application while smaller tools use only shared cores.
legacy = [
    "build",
    "tool-cli",
    "dep:axoupdater",
    "dep:reqwest",
    "dep:semver",
    "dep:tokio",
    "dep:crossterm",
    "dep:directories",
    "dep:gix",
    "dep:unicode-general-category",
    "dep:toml_edit",
    "dep:base64",
    "dep:zip",
    "dep:self-replace",
]

[profile.dev]
opt-level = 0 # No optimization for fast compile times
debug = true  # Include debug symbols

[profile.release]
opt-level = 3 # Maximum optimization for performance
debug = false # Exclude debug symbols for smaller binary size
lto = true    # Link-Time Optimization for further size reduction

[profile.dist]
inherits = "release"
lto = "thin"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Curl/Rustls and existing cross-platform crates pin incompatible windows-sys lines.
multiple_crate_versions = { level = "allow", priority = 1 }

[dependencies]
axoupdater = { version = "0.10.2", default-features = false, features = ["github_releases"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"], optional = true }
semver = { version = "1.0.28", optional = true }
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time", "net"], optional = true }
clap = { version = "4.6.6", features = ["derive", "string"], optional = true }
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows", "bracketed-paste"], optional = true }
ctrlc = { version = "3.5.2", features = ["termination"], optional = true }
directories = { version = "6.0.0", optional = true }
fluent = { version = "0.17.0", optional = true }
gix = { version = "0.87.1", default-features = false, features = ["blocking-http-transport-curl-rustls", "max-performance", "revision", "sha1", "status", "worktree-mutation"], optional = true }
gix-validate = { version = "0.11.4", default-features = false }
roxmltree = { version = "0.21.1", default-features = false, features = ["std", "positions"] }
quick-xml = { version = "0.42.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
sys-locale = { version = "0.3.2", optional = true }
unicode-general-category = { version = "1.1.0", optional = true }
toml = { version = "1.1.5", default-features = false, features = ["display", "parse", "serde"] }
toml_edit = { version = "0.25.13", default-features = false, features = ["display", "parse"], optional = true }
base64 = { version = "0.23.1", default-features = false, features = ["std"], optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
yaml-edit = { version = "0.3.2", default-features = false }

[target.'cfg(windows)'.dependencies]
self-replace = { version = "1.5.0", optional = true }

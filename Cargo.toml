[package]
name = "eska"
default-run = "eska"
version = "0.14.3"
edition = "2024"
publish = true
description = "Утилита для разработчиков 1С Enterprise"
license = "Apache-2.0"
repository = "https://github.com/1c-tooling/eska"
readme = "README.md"
keywords = ["1c-enterpirse", "cli"]
categories = ["command-line-utilities", "filesystem"]
authors = ["Aleksey Kalsin <aleksey@kalsin.pro>"]

[workspace]
members = [".", "crates/*"]
default-members = [".", "crates/*"]
exclude = ["tests/fixtures/ibcmd"]
resolver = "3"

[profile.dev]
opt-level = 0 # No optimization for fast compile times
debug = true  # Include debug symbols

[profile.release]
opt-level = 3 # Maximum optimization for performance
debug = false # Exclude debug symbols for smaller binary size
lto = true    # Link-Time Optimization for further size reduction

[profile.dist]
inherits = "release"
lto = "thin"

[lints]
workspace = true

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Curl/Rustls and existing cross-platform crates pin incompatible windows-sys lines.
multiple_crate_versions = { level = "allow", priority = 1 }

[dependencies]
eska-tool-runtime = { path = "crates/eska-tool-runtime" }
eska-presentation = { path = "crates/eska-presentation" }
axoupdater = { version = "0.10.2", default-features = false, features = ["github_releases"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
semver = "1.0.28"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time", "net"] }
clap = { version = "4.6.6", features = ["derive", "string"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
eska-vcs = { path = "crates/eska-vcs" }
eska-project-core = { path = "crates/eska-project-core" }
eska-project = { path = "crates/eska-project" }
gix = { version = "0.87.1", default-features = false, features = ["blocking-http-transport-curl-rustls", "max-performance", "revision", "sha1", "status", "worktree-mutation"] }
roxmltree = { version = "0.21.1", default-features = false, features = ["std", "positions"] }
toml = { version = "1.1.5", default-features = false, features = ["display", "parse", "serde"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
self-replace = "1.5.0"

# gix-macros requires syn 2, while the current derive dependencies require syn 3.
# Optional defmt metadata requires bitflags 1 alongside bitflags 2. gix also needs
# dashmap/hashbrown 0.14, clru and gix-imara-diff/hashbrown 0.16, and gix-hashtable
# and gix-index/hashbrown 0.17. These incompatible versions cannot be unified here.
allowed-duplicate-crates = ["bitflags", "hashbrown", "syn"]

[package]
name = "eska-bsl-adapter"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Canonical ESKA metadata inputs for the selected BSL kernel"
repository = "https://github.com/1c-tooling/eska"
readme = "README.md"
keywords = ["1c", "metadata", "bsl"]
categories = ["development-tools"]

[workspace]

[dependencies]
eska = { path = "../..", default-features = false }
bsl-metadata = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }

[dev-dependencies]
serde_json = "1.0"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# The shared YAML CST and pinned BSL kernel require different hashbrown/rustc-hash lines.
multiple_crate_versions = { level = "allow", priority = 1 }

[profile.dev]
debug = 0

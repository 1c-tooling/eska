[workspace]
resolver = "2"
members = ["crates/base-db", "crates/bsl-metadata", "crates/hir-ty", "crates/hir-def", "crates/ide-db", "crates/parser-error", "crates/ide"]

[workspace.package]
version = "0.2.85"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["BSL Analyzer Contributors"]
repository = "https://github.com/itrous/bsl-analyzer"
rust-version = "1.95"

[workspace.dependencies]
base-db = { path = "crates/base-db" }
bsl-config = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
bsl-conventions = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
bsl-metadata = { path = "crates/bsl-metadata" }
bsl-platform = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
bsl-types = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
cfg = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
cfg-types = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
criterion = { version = "0.5", features = ["html_reports"] }
dashmap = "5.5"
dataflow = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
elsa = "1.10"
expect-test = "1.4"
hir = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
hir-def = { path = "crates/hir-def" }
hir-ty = { path = "crates/hir-ty" }
ide = { path = "crates/ide" }
ide-db = { path = "crates/ide-db" }
ide-assists = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
ide-diagnostics = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
code-chunk = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
symbol-info = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
indexmap = "2.1"
intern = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
la-arena = "0.3"
lexer = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
line-index = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
once_cell = "1.19"
ordered-float = "5.1"
parking_lot = "0.12"
parser = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
parser-error = { path = "crates/parser-error" }
project-model = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
rayon = "1.8"
rustc-hash = "2.0"
salsa = { version = "=0.28.2", features = ["rayon", "macros", "salsa_unstable"] }
sdbl-hir = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
triomphe = { version = "0.1.14", default-features = false, features = ["std"] }
nucleo-matcher = "0.3"
smol_str = "0.3.2"
smallvec = "1.13"
text-size = "1.1"
stdx = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
syntax = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
tempfile = "3.8"
test-fixture = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }
thiserror = "1.0"
tracing = { version = "0.1.42", default-features = false, features = ["std"] }
vfs = { git = "https://github.com/1c-tooling/bsl-analyzer.git", rev = "9021ba07471eee8a2614bed2105a2c8699f60780" }

[patch."https://github.com/1c-tooling/bsl-analyzer.git"]
base-db = { path = "crates/base-db" }
bsl-metadata = { path = "crates/bsl-metadata" }
hir-ty = { path = "crates/hir-ty" }
hir-def = { path = "crates/hir-def" }
ide-db = { path = "crates/ide-db" }
ide = { path = "crates/ide" }
parser-error = { path = "crates/parser-error" }

[patch.crates-io]
salsa = { git = "https://github.com/itrous/salsa.git", rev = "5d2686f1f94dc3d618569652d5576ce997491b3b" }
salsa-macros = { git = "https://github.com/itrous/salsa.git", rev = "5d2686f1f94dc3d618569652d5576ce997491b3b" }

[profile.dev]
debug = 0

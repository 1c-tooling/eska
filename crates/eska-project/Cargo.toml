[package]
name = "eska-project"
version = "0.14.3"
edition = "2024"
publish = false
description = "Standalone Designer XML project operations and metadata presentation"
license = "Apache-2.0"
repository = "https://github.com/1c-tooling/eska"
readme = "../../README.md"
keywords = ["1c-enterprise", "cli", "designer-xml"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Aleksey Kalsin <aleksey@kalsin.pro>"]

[lints]
workspace = true

[dependencies]
eska-project-core = { path = "../eska-project-core" }
eska-presentation = { path = "../eska-presentation" }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
clap = { version = "4.6.6", features = ["derive", "string"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }

[package]
name = "eska-analyzer"
version.workspace = true
edition = "2024"
publish = true
description = "External bsl-analyzer process contract and derived project configuration"
license = "Apache-2.0"
repository = "https://github.com/1c-tooling/eska"
readme = "../../README.md"
keywords = ["1c-enterprise", "bsl", "analysis"]
categories = ["development-tools"]
authors = ["Aleksey Kalsin <aleksey@kalsin.pro>"]

[lints]
workspace = true

[dependencies]
eska-project-core = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = { version = "1.1.5", default-features = false, features = ["display", "parse", "serde"] }
toml_edit = { version = "0.25.13", default-features = false, features = ["display", "parse"] }

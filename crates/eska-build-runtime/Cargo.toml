[package]
name = "eska-build-runtime"
version = "0.14.3"
edition = "2024"
publish = false
description = "Shared 1C platform runner and reversible native artifact execution"
license = "Apache-2.0"
repository = "https://github.com/1c-tooling/eska"
readme = "../../README.md"
keywords = ["1c-enterprise", "designer-xml", "build"]
categories = ["development-tools", "filesystem"]
authors = ["Aleksey Kalsin <aleksey@kalsin.pro>"]

[lints]
workspace = true

[dependencies]
eska-project-core = { path = "../eska-project-core" }
directories = "6.0.0"
gix-path = "0.12.6"
roxmltree = { version = "0.21.1", default-features = false, features = ["std", "positions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = { version = "1.1.5", default-features = false, features = ["display", "parse", "serde"] }

[target.'cfg(unix)'.dependencies]
eska-tool-runtime = { path = "../eska-tool-runtime" }
signal-hook = { version = "0.4.5", default-features = false }

[target.'cfg(windows)'.dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }

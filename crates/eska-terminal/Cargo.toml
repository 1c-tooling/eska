[package]
name = "eska-terminal"
version.workspace = true
edition = "2024"
publish = true
description = "Shared keyboard selection and terminal progress for ESKA CLI tools"
license = "Apache-2.0"
repository = "https://github.com/1c-tooling/eska"
readme = "../../README.md"
keywords = ["1c-enterprise", "cli", "terminal"]
categories = ["command-line-interface"]
authors = ["Aleksey Kalsin <aleksey@kalsin.pro>"]

[lints]
workspace = true

[dependencies]
eska-presentation = { workspace = true }
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows", "bracketed-paste"] }

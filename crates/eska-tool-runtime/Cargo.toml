[package]
name = "eska-tool-runtime"
version = "0.14.3"
edition = "2024"
publish = false
description = "Owned component processes and bounded internal tool protocols"
license = "Apache-2.0"
repository = "https://github.com/1c-tooling/eska"
readme = "../../README.md"
keywords = ["1c-enterprise", "cli", "process"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Aleksey Kalsin <aleksey@kalsin.pro>"]

[lints]
workspace = true

[dependencies]
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4.5", default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }

[package]
name = "eska-check"
version.workspace = true
edition = "2024"
publish = true
description = "Complete Designer XML and external BSL analysis for CI"
license = "Apache-2.0"
repository = "https://github.com/1c-tooling/eska"
readme = "../../README.md"
keywords = ["1c-enterprise", "bsl", "analysis", "cli"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Aleksey Kalsin <aleksey@kalsin.pro>"]

[lints]
workspace = true

[dependencies]
eska-project-core = { workspace = true }
eska-analyzer = { workspace = true }
eska-presentation = { workspace = true }
clap = { version = "4.6.7", features = ["derive", "string"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

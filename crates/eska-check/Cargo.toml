[package]
name = "eska-check"
version = "0.14.3"
edition = "2024"
publish = false
description = "Complete Designer XML and external BSL analysis for CI"
license = "Apache-2.0"
repository = "https://github.com/1c-tooling/eska"
readme = "../../README.md"
keywords = ["1c-enterprise", "bsl", "analysis", "cli"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Aleksey Kalsin <aleksey@kalsin.pro>"]

[lints]
workspace = true

[dependencies]
eska-project-core = { path = "../eska-project-core" }
eska-analyzer = { path = "../eska-analyzer" }
eska-presentation = { path = "../eska-presentation" }
clap = { version = "4.6.6", features = ["derive", "string"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
serde_json = "1.0.151"
